name: Cleanup Actions Storage

on:
  schedule:
    # Runs daily at 03:00 UTC, clear of the pipeline (13:00) and outreach (15:00) runs.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = only log what would be deleted, false = actually delete"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-storage
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs and expired artifacts
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Keep the most recent N completed runs of every workflow, and never
            // touch anything from the last KEEP_DAYS days regardless of count.
            const KEEP_DAYS = 7;
            const KEEP_PER_WORKFLOW = 5;
            const cutoff = new Date(Date.now() - KEEP_DAYS * 24 * 60 * 60 * 1000);

            // --- 1. Delete old workflow runs (this also frees the logs/artifacts tied to them) ---
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo });
            let deletedRuns = 0;

            for (const wf of workflows) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: wf.id, per_page: 100,
              });

              // Only ever consider finished runs; never touch in-progress/queued ones.
              const finished = runs.filter(r => r.status === 'completed');
              finished.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const candidates = finished.slice(KEEP_PER_WORKFLOW);

              for (const run of candidates) {
                if (new Date(run.created_at) >= cutoff) continue; // still within the grace window
                deletedRuns++;
                console.log(`${dryRun ? '[dry-run] would delete' : 'Deleting'} run ${run.id} (${wf.name}, ${run.created_at})`);
                if (!dryRun) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  } catch (e) {
                    console.log(`  failed: ${e.message}`);
                  }
                }
              }
            }
            console.log(`Runs ${dryRun ? 'that would be ' : ''}deleted: ${deletedRuns}`);

            // --- 2. Delete any artifacts that slipped past their own retention window ---
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            let deletedArtifacts = 0;
            for (const art of artifacts) {
              if (art.expired) {
                deletedArtifacts++;
                console.log(`${dryRun ? '[dry-run] would delete' : 'Deleting'} artifact ${art.id} (${art.name}, ${art.size_in_bytes} bytes)`);
                if (!dryRun) {
                  try {
                    await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: art.id });
                  } catch (e) {
                    console.log(`  failed: ${e.message}`);
                  }
                }
              }
            }
            console.log(`Artifacts ${dryRun ? 'that would be ' : ''}deleted: ${deletedArtifacts}`);
